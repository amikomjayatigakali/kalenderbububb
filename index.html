<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F1">
<title>Kalender Kerja Bubub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F1;
  --card:#FFFFFF;
  --ink:#1D211E;
  --dim:#8A928C;
  --line:#EDEFEA;

  --lime:#DFEA6E;
  --lime-soft:#F3F7CF;
  --mint:#8ECFC8;
  --mint-soft:#DCF0EE;
  --butter:#F7D774;
  --butter-soft:#FDF1D2;
  --blush:#F5A9A0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom));
}
.app{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 0}
.sec-head span{font-size:.75rem;color:var(--dim)}
.card{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 6px 20px rgba(29,33,30,.05)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:2px 4px}
.avatar{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--lime);display:grid;place-items:center;
  font-family:'Outfit',sans-serif;font-weight:600;font-size:1rem;
}
.hello{font-family:'Outfit',sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:-.03em}
.hello small{display:block;font-family:'Plus Jakarta Sans';font-size:.75rem;font-weight:400;color:var(--dim);letter-spacing:0;margin-top:2px}
[contenteditable]{outline:none;border-bottom:1px dashed #D6DAD3;padding-bottom:1px}
[contenteditable]:focus{border-bottom-color:var(--mint)}

/* hero */
.hero{position:relative;overflow:hidden}
.hero .blob{position:absolute;width:200px;height:200px;border-radius:50%;top:-90px;right:-60px;opacity:.6}
.pill{
  display:inline-flex;align-items:center;gap:6px;background:var(--bg);
  border-radius:99px;padding:7px 14px;font-size:.75rem;font-weight:600;color:var(--dim);position:relative;
}
.hero-icon{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin:18px 0 14px;position:relative}
.hero-icon svg{width:40px;height:40px}
.state{font-family:'Outfit',sans-serif;font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;position:relative}
.state-note{font-size:.85rem;color:var(--dim);margin-top:7px;line-height:1.5;position:relative}
.bars{display:flex;gap:5px;margin-top:16px;position:relative}
.bars i{flex:1;height:5px;border-radius:99px;background:var(--line)}

/* two-up */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:22px;padding:16px}
.mini .k{font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.6}
.mini .v{font-family:'Outfit',sans-serif;font-size:1.7rem;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1}
.mini .s{font-size:.75rem;opacity:.65;margin-top:3px}

/* calendar */
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
select{
  flex:1;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;color:var(--ink);
  border:none;background:var(--bg);border-radius:99px;padding:11px 16px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 20px) 19px,calc(100% - 15px) 19px;background-size:5px 5px;background-repeat:no-repeat;
}
.arrow{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem}
.arrow:active{background:var(--bg)}
.arrow:disabled{opacity:.3}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow div{text-align:center;font-size:.68rem;font-weight:600;color:var(--dim);padding-bottom:8px}
.day{aspect-ratio:1/1.12;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:600;color:var(--ink)}
.day.empty{background:none}
.day svg{width:13px;height:13px;opacity:.85}
.day.pagi{background:var(--butter-soft)}
.day.malam{background:var(--mint-soft)}
.day.libur{background:var(--lime-soft)}
.day.today{background:var(--ink);color:#fff}
.day.today svg{stroke:#fff}
.legend{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:6px;font-size:.73rem;color:var(--dim)}
.lg span{width:20px;height:20px;border-radius:7px;display:grid;place-items:center}
.lg svg{width:12px;height:12px}

/* list libur */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none;padding-bottom:0}
.row .badge{width:42px;height:42px;border-radius:14px;background:var(--lime-soft);display:grid;place-items:center;flex:none}
.row .badge svg{width:19px;height:19px}
.row .t{font-family:'Outfit',sans-serif;font-weight:600;font-size:.95rem}
.row .d{font-size:.75rem;color:var(--dim);margin-top:2px}
.row .r{margin-left:auto;font-size:.75rem;font-weight:600;color:var(--dim);white-space:nowrap}

.foot{text-align:center;font-size:.72rem;color:var(--dim);line-height:1.7;padding:6px 20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-pagi" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8.5" cy="8" r="3.2"/><path d="M8.5 2.2v1.2M8.5 12.6v.6M3.2 8H2M15 8h-1.2M4.7 4.2l-.8-.8M13.1 3.4l-.8.8"/>
    <path d="M7 20h9.2a3.4 3.4 0 0 0 .3-6.8 4.6 4.6 0 0 0-8.6-1A3.4 3.4 0 0 0 7 20Z"/>
  </g>
  <g id="i-malam" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14.2A8 8 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z"/>
    <path d="M16.5 3v2.6M15.2 4.3h2.6"/><circle cx="19.6" cy="8.4" r=".8" fill="currentColor" stroke="none"/>
  </g>
  <g id="i-libur" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20.2s-7.6-4.7-7.6-10.3a4.4 4.4 0 0 1 7.6-2.7 4.4 4.4 0 0 1 7.6 2.7c0 5.6-7.6 10.3-7.6 10.3Z"/>
  </g>
</defs></svg>

<div class="app">

  <div class="top">
    <div class="hello">
      Kalender Kerja Bubub
      <small>3 pagi, 3 malam, 3 libur</small>
    </div>
  </div>

  <!-- HERO -->
  <section class="card hero" id="hero">
    <div class="blob" id="blob"></div>
    <span class="pill" id="pillDate"></span>
    <div class="hero-icon" id="heroIcon"></div>
    <div class="state" id="state"></div>
    <p class="state-note" id="note"></p>
    <div class="bars" id="bars"></div>
  </section>

  <!-- QUICK -->
  <div class="duo">
    <div class="mini" style="background:var(--lime)"><div class="k">Libur bareng</div><div class="v" id="qDays"></div><div class="s" id="qDate"></div></div>
    <div class="mini" style="background:var(--mint)"><div class="k">Besok</div><div class="v" id="qTom"></div><div class="s" id="qTomS"></div></div>
  </div>

  <!-- CALENDAR -->
  <section class="card">
    <div class="calbar">
      <button class="arrow" id="prev" aria-label="Bulan sebelumnya">←</button>
      <select id="picker" aria-label="Pilih bulan"></select>
      <button class="arrow" id="next" aria-label="Bulan berikutnya">→</button>
    </div>
    <div class="dow"><div>S</div><div>S</div><div>R</div><div>K</div><div>J</div><div>S</div><div>M</div></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <div class="lg"><span style="background:var(--butter-soft)"><svg viewBox="0 0 24 24"><use href="#i-pagi"/></svg></span>Pagi</div>
      <div class="lg"><span style="background:var(--mint-soft)"><svg viewBox="0 0 24 24"><use href="#i-malam"/></svg></span>Malam</div>
      <div class="lg"><span style="background:var(--lime-soft)"><svg viewBox="0 0 24 24"><use href="#i-libur"/></svg></span>Libur</div>
    </div>
  </section>

  <!-- NEXT HOLIDAYS -->
  <div class="sec-head"><h2>Jatah libur berikutnya</h2><span>3 hari sekali blok</span></div>
  <section class="card" id="liburList"></section>

  <!-- SHIFT SUMMARY -->
  <div class="sec-head"><h2>Bulan ini</h2><span id="sumMonth"></span></div>
  <div class="duo" style="grid-template-columns:repeat(3,1fr)">
    <div class="mini" style="background:var(--butter-soft)"><div class="k">Pagi</div><div class="v" id="sPagi">0</div></div>
    <div class="mini" style="background:var(--mint-soft)"><div class="k">Malam</div><div class="v" id="sMalam">0</div></div>
    <div class="mini" style="background:var(--lime-soft)"><div class="k">Libur</div><div class="v" id="sLibur">0</div></div>
  </div>

  <p class="foot">Siklus 9 hari: 3 pagi, 3 malam, 3 libur.<br>Patokan 23 Agustus 2026 libur hari pertama.</p>
</div>

<script>
const ANCHOR=new Date(2026,7,23), DAY=86400000;
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const mid=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fmt=d=>`${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)}`;
const ico=id=>`<svg viewBox="0 0 24 24"><use href="#i-${id}"/></svg>`;

const S={
  libur:{key:'libur',label:'Libur',bg:'var(--lime-soft)',accent:'var(--lime)',
    note:'Hari ini nggak kerja. Bebas mau video call lama atau sekadar nemenin dia seharian.'},
  pagi:{key:'pagi',label:'Pagi',bg:'var(--butter-soft)',accent:'var(--butter)',
    note:'Kerja pagi. Paginya sibuk, tapi sore sampai malam dia udah bebas.'},
  malam:{key:'malam',label:'Malam',bg:'var(--mint-soft)',accent:'var(--mint)',
    note:'Kerja malam. Siang dipakai tidur, jadi jangan kaget kalau chat lama dibalas.'}
};
function shiftOf(date){
  const m=((Math.round((mid(date)-ANCHOR)/DAY)%9)+9)%9;
  if(m<3)return{...S.libur,seq:m+1};
  if(m<6)return{...S.pagi,seq:m-2};
  return{...S.malam,seq:m-5};
}
const today=mid(new Date());

/* hero */
const s=shiftOf(today);
document.getElementById('blob').style.background=s.accent;
document.getElementById('pillDate').textContent=`${HARI[today.getDay()]}, ${today.getDate()} ${BULAN[today.getMonth()]} ${today.getFullYear()}`;
const hi=document.getElementById('heroIcon');
hi.style.background=s.bg; hi.innerHTML=ico(s.key);
document.getElementById('state').textContent=s.key==='libur'?'Libur':`Shift ${s.label}`;
document.getElementById('note').textContent=s.note;
document.getElementById('bars').innerHTML=[1,2,3].map(i=>`<i style="${i<=s.seq?'background:'+s.accent:''}"></i>`).join('');

/* libur berikutnya */
function liburBlocks(n){
  const out=[]; let d=new Date(today);
  while(out.length<n){
    const x=shiftOf(d);
    if(x.key==='libur'&&x.seq===1) out.push(new Date(d));
    d=new Date(d.getTime()+DAY);
  }
  return out;
}
const blocks=liburBlocks(4);
const first=blocks[0], gap=Math.round((first-today)/DAY);
document.getElementById('qDays').textContent=(s.key==='libur'?`${4-s.seq} hr`:`${gap} hr`);
document.getElementById('qDate').textContent=s.key==='libur'?'sisa libur sekarang':`mulai ${fmt(first)}`;
document.getElementById('liburList').innerHTML=blocks.map(b=>{
  const end=new Date(b.getTime()+2*DAY);
  const d=Math.round((b-today)/DAY);
  return `<div class="row">
    <div class="badge">${ico('libur')}</div>
    <div><div class="t">${b.getDate()}–${end.getDate()} ${BULAN[end.getMonth()]}</div>
    <div class="d">${HARI[b.getDay()]} sampai ${HARI[end.getDay()]}</div></div>
    <div class="r">${d<=0?'sekarang':d+' hari lagi'}</div></div>`;
}).join('');

/* hitungan LDR */
const tom=new Date(today.getTime()+DAY), ts=shiftOf(tom);
document.getElementById('qTom').textContent=ts.label;
document.getElementById('qTomS').textContent=`${fmt(tom)} · hari ke-${ts.seq}`;
function counters(){}
counters();

/* kalender */
const picker=document.getElementById('picker'), months=[];
for(let y=2026,m=7;;){ months.push({y,m}); if(y===2027&&m===11)break; m++; if(m>11){m=0;y++;} }
months.forEach((o,i)=>{const op=document.createElement('option');op.value=i;op.textContent=`${BULAN[o.m]} ${o.y}`;picker.appendChild(op);});
let idx=months.findIndex(o=>o.y===today.getFullYear()&&o.m===today.getMonth()); if(idx<0)idx=0;

function render(){
  const {y,m}=months[idx]; picker.value=idx;
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===months.length-1;
  const lead=(new Date(y,m,1).getDay()+6)%7, total=new Date(y,m+1,0).getDate();
  let html='<div class="day empty"></div>'.repeat(lead); const c={pagi:0,malam:0,libur:0};
  for(let d=1;d<=total;d++){
    const date=new Date(y,m,d), x=shiftOf(date); c[x.key]++;
    const t=date.getTime()===today.getTime()?' today':'';
    html+=`<div class="day ${x.key}${t}" title="${d} ${BULAN[m]} · ${x.label} ${x.seq}/3"><span>${d}</span>${ico(x.key)}</div>`;
  }
  document.getElementById('grid').innerHTML=html;
  sPagi.textContent=c.pagi; sMalam.textContent=c.malam; sLibur.textContent=c.libur;
  document.getElementById('sumMonth').textContent=`${BULAN[m]} ${y}`;
}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
document.getElementById('next').onclick=()=>{if(idx<months.length-1){idx++;render();}};
picker.onchange=e=>{idx=+e.target.value;render();};
render();
</script>
</body>
</html>
